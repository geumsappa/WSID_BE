name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: wsid_test
          POSTGRES_USER: wsid
          POSTGRES_PASSWORD: wsid
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wsid -d wsid_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/wsid_test
      WSID_TEST_DB_URL: jdbc:postgresql://localhost:5432/wsid_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: 단위·DB·HTTP 통합 테스트
        run: ./gradlew test dbTest integrationTest --max-workers=2
