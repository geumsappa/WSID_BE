# 로컬 HTTP 개발에서만 Secure 쿠키를 해제해요. 운영은 기본값 true를 사용해요.
spring:
  config:
    # 실행 작업 디렉터리는 WSID_BE로 설정해요. 값은 따옴표 없이 KEY=value로 작성해요.
    import: "optional:file:./.env[.properties]"

server:
  servlet:
    session:
      cookie:
        secure: false

wsid:
  cors:
    allowed-origins: ${WSID_CORS_ALLOWED_ORIGINS:http://localhost:8443}
