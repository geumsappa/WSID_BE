      actions:
        - "112나 돈을 보낸 금융회사 콜센터에 바로 연락해 지급정지를 요청하세요."
        - "전화로 피해구제를 신청했다면 원칙적으로 신청일부터 3영업일 안에 서류를 제출하세요. 제출 방법과 기한은 해당 금융회사에 바로 확인하세요."
