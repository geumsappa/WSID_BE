# 로컬 개발용 PostgreSQL과 Redis. 각자 자기 컴퓨터에서 띄워요.
#   docker compose up -d      시작
#   docker compose down -v    데이터까지 지우고 종료
services:
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - wsid-redis-data:/data
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: wsid
      POSTGRES_USER: wsid
      POSTGRES_PASSWORD: wsid
    ports:
      - "5432:5432"
    volumes:
      - wsid-db:/var/lib/postgresql/data

volumes:
  wsid-db:
  wsid-redis-data:
